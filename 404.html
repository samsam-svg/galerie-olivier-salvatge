<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Page introuvable — Olivier Salvatge Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,400;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#EDEAE1; --ink:#18160F; --ink-soft:#726B5C; --accent:#A6702F; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:Inter, system-ui, -apple-system, sans-serif;
    color:var(--paper);
    background:
      radial-gradient(1200px 800px at 15% 10%, #432DEB 0%, transparent 60%),
      radial-gradient(1000px 700px at 85% 90%, #C723B2 0%, transparent 55%),
      linear-gradient(135deg, #201540, #3a1f5c 60%, #5c2b6e);
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .wrap{max-width:560px}
  .label{font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.8;margin-bottom:14px}
  h1{font-family:Fraunces, serif;font-style:italic;font-weight:400;font-size:clamp(4rem,14vw,7rem);margin:0;line-height:1}
  p{opacity:.85;line-height:1.6;margin:20px 0 30px;font-size:1.05rem}
  a.cta{
    display:inline-flex;align-items:center;justify-content:center;
    padding:14px 28px;border-radius:9999px;
    border:1px solid rgba(255,255,255,.4);
    background:rgba(255,255,255,.1);
    color:#fff;text-decoration:none;font-weight:600;letter-spacing:.03em;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 18px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .15s ease, filter .15s ease;
  }
  a.cta:hover{transform:translateY(-2px);filter:brightness(1.08)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">Olivier Salvatge Studio</div>
    <h1>404</h1>
    <p>Cette page n'existe pas, ou a été déplacée.<br>Comme une toile égarée dans l'atelier — retournons à la galerie.</p>
    <a class="cta" href="/">← Retour à la galerie</a>
  </div>
</body>
</html>
